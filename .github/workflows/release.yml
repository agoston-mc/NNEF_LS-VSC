name: Release VSIX

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @vscode/vsce package
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
